name: Verifying Everything Compiles
on:
  push:
    branches: "master"
  pull_request:
    branches: "master"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Verify plugin and development sources
      run: bash ./gradlew build javadoc compileIntegrationTestJava compileProfilingJava -x createManifestIfMissing -x updatePluginManifest
